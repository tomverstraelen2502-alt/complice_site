<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Merci · Complice</title>
  <meta name="theme-color" content="#938A2D">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="img/icone-64.png" type="image/png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body style="background:var(--olive);color:var(--cream)">
  <main class="wrap" style="min-height:100vh;display:grid;align-content:center;gap:22px;padding-block:60px">
    <span class="mark mark-cream" aria-hidden="true"></span>
    <h1 style="font-size:clamp(40px,7vw,84px)">Merci, c'est bien reçu.</h1>
    <p style="font-size:19px;max-width:46ch">Nous vous contactons dans les 24 heures pour vous proposer les couleurs, confirmer le délai et convenir ensemble de la remise et du paiement.</p>
    <pre id="recap" style="font:inherit;white-space:pre-wrap;background:rgba(0,0,0,.12);padding:16px 18px;border-radius:10px;max-width:560px;margin:0" hidden></pre>
    <p><a class="btn btn-cream" href="index.html">Retour au site</a></p>
  </main>
  <script>
    try { var r = sessionStorage.getItem("commande"); if (r) { var el = document.getElementById("recap"); el.textContent = r; el.hidden = false; } } catch (e) {}
  </script>
</body>
</html>
